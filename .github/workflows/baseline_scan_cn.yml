name: Baseline Scan (CN)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of stocks to scan (0 for all)'
        required: false
        default: '0'

# 权限 - 允许写入仓库
permissions:
  contents: write

jobs:
  baseline-scan-cn:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install -r versions/v2/requirements.txt
      
      - name: Run baseline scan (CN)
        working-directory: versions/v2
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          if [ "$LIMIT" = "0" ]; then
            python scripts/scan_cn_blue_baseline.py
          else
            python scripts/scan_cn_blue_baseline.py --limit "$LIMIT"
          fi
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: baseline-scan-cn-${{ github.run_number }}
          path: versions/v2/*.csv
          retention-days: 30
          if-no-files-found: ignore
      
      # 提交数据库到仓库 - 保存 baseline 结果
      - name: Commit database to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 添加数据库文件
          git add versions/v2/db/coral_creek.db || true
          
          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Baseline CN: $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            
            # 尝试 rebase，如果失败则使用 ours 策略合并
            if ! git pull --rebase origin main; then
              echo "Rebase failed, resolving conflicts with ours strategy..."
              git rebase --abort || true
              git pull -X ours origin main || true
              git push || git push --force-with-lease
            else
              git push
            fi
          fi
